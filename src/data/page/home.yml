about:
  story: >-
    The first time I took apart a radio was when I didn’t know how to put it
    back together. Motors, contraptions, anything I could get my hands on, I
    would tear them down before I let them live. I devoured every book I thought
    might explain them, long after I’d realized how little I understood. Most
    people grow up, and move on. I got better tools. And now, I’m spending my
    life being an engineering student at BITS Pilani, learning to think that
    specializing is the only way to proceed. But then again, I never stop being
    the curious child, who wondered about every object before her.

    The only difference is that I found better tools. I realized that if I was going to study business, or science, or artificial intelligence, it was not to narrow myself down to one specific field. Because whether you are designing a financial model or building a circuit, you are always searching for something real within the noise. You are trying to get your message across, to another person or another machine. A great business plan and a well written essay are not so different. Once I saw that, the pressure to specialize dissolved. Instead, I focused on the tools I needed to connect disciplines and build things that worked. In turn, I built the infrastructure around those ideas, this website, as proof of concept. This living document is not a resume. It is a record of my practice, of what I am working on, and what I plan to do next. It is not filtered for potential employers, because it is not about what I am looking for. It is about what I am building. In addition to that, I have started writing In Search Of, a newsletter where I attempt to articulate thoughts as they come to me, before they have any real shape or direction. This is where I think out loud. It is raw and exposed, as most unformed ideas tend to be. But it is also real, and human.

    I’m not trying to be some sort of renaissance man and dabble in everything. This is not some deep philosophy I’ve discovered on the way to becoming a serious professional, which I intend to hide behind until the right moment. This is me, building and thinking, learning and practicing, in the hopes of proving to myself that I am capable of thinking beyond the system. Because I believe the future belongs to those willing to bring ideas to life, to create systems that think for themselves, and that take real shape. To those who are willing to build something the world needs, instead of something the world wants, and to do it all with as much passion and conviction as they can pour into it. That is what I am practicing. That is what I am building. And that is what I believe in.
  values:
    - title: Curiosity Over Comfort
      description: I choose the harder path when it teaches me more.
    - title: Build in Public
      description: Ideas are cheap. Shipping is everything. I document as I go.
    - title: Depth Over Breadth
      description: I go deep on the things that matter rather than skimming everything.
    - title: Genuine Always
      description: No personas, no pretending. What you see is what you get.
  philosophy: "The best way to predict your future is to build it, one project at
    a time, one lesson at a time. I believe in compounding: small daily
    improvements that, over years, create something remarkable. I believe in
    sharing: the best way to learn is to teach, and the best way to grow is to
    give. And I believe in patience: great things take time, and the journey is
    the destination."
  interests:
